name: Build and deploy to GitHub Pages

on:
  # Run on every push to main (for source-code updates + initial deploy)
  push:
    branches: [main]

  # Run every 15 minutes to refresh the curated feed.
  # Note: GitHub Actions schedulers are best-effort; actual interval
  # averages 10-20 minutes during normal load.
  schedule:
    - cron: "*/15 * * * *"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets the workflow delete the duplicate artifacts a retried upload leaves behind.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore archive.json from previous run
        # GitHub Pages deploys are ephemeral, so we stash the archive in a cache
        # keyed by date so it survives between runs within a day.
        uses: actions/cache@v4
        with:
          path: public/data/archive.json
          key: archive-json-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            archive-json-${{ runner.os }}-

      - name: Build data (fetch feeds, score, write JSON)
        env:
          NO_DB: "1"
        run: node scripts/build-data.js

      - name: Save archive.json for next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: public/data/archive.json
          key: archive-json-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # When the artifact finalize call hangs, GitHub's backend retries it and
      # each retry registers another artifact under the same name. deploy-pages
      # then refuses to pick one ("Multiple artifacts named github-pages were
      # unexpectedly found"). All copies are byte-identical, so keep the newest.
      - name: Drop duplicate Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dupes=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")]
                  | sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $dupes; do
            echo "Deleting duplicate github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages has answered with 503s, deploy timeouts and "Failed to get ID
        # Token" often enough to redden the run for reasons nothing in this repo
        # caused. Each cleared on its own, so try a second time before failing.
        continue-on-error: true

      - name: Retry deploy once
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
